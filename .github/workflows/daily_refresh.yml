name: Daily Flipkart Data Refresh

on:
  schedule:
    # Runs every day at 07:49 UTC (1:19 PM IST)
    - cron: "49 7 * * *"
  workflow_dispatch:   # Allow manual trigger from GitHub UI

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # Scraping 1000 product pages takes ~50 min

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Install Chrome (latest stable) + ChromeDriver
      - name: Install Chrome and ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # 4. Install Python dependencies
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install selenium asyncpg python-dotenv

      # 5. Install Xvfb (Virtual Framebuffer) to run headed Chrome in CI
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # 6. Scrape Flipkart and load fresh data into Neon using Xvfb
      - name: Scrape Flipkart and load into Neon PostgreSQL
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python scrape_to_neon.py
